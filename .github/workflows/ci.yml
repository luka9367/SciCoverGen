name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest
        pip install -e .

    - name: Verify imports
      run: |
        python -c "import scicovergen; print('version:', scicovergen.__version__)"
        python -c "from scicovergen.generator import SciCoverGen, quick_generate"
        python -c "from scicovergen.cli import main"
        python -c "from scicovergen.prompts import PromptBuilder"
        python -c "from scicovergen.utils import read_file, slugify"

    - name: Test with pytest
      run: |
        pytest tests/ -v
